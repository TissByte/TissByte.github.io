name: Build and deploy the site

# Deploys https://tissbyte.github.io on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Hardening notes
# - Third-party actions are pinned to commit SHAs (a moving tag like v4 can be repointed); Dependabot keeps them fresh.
# - Permissions are none by default; each job asks only for what it needs. The build job can only read the repo,
#   so a pull request (even from a fork) can run the build and the audit but can never publish anything.
# - A pull-request run can no longer cancel a production deploy: they use different concurrency groups, and a
#   deploy in progress is never cancelled.
# - No secrets are used anywhere in this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # zero dependencies: nothing to install
      - name: Build (fails on a project without copy, unknown placeholders, missing assets, broken anchors)
        run: npm run build
      - name: Contrast audit (WCAG 2.2 AAA on the worst-case backdrop)
        run: npm run contrast
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
