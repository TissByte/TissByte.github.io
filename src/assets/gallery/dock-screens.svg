<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="Two displays: the macOS Dock on the main display, MacOS Dock on the other one">
  <defs>
    <linearGradient id="wallOther" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b5c"/>
      <stop offset="0.55" stop-color="#3b2f6b"/>
      <stop offset="1" stop-color="#7a3b5e"/>
    </linearGradient>
    <linearGradient id="wallMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21506b"/>
      <stop offset="1" stop-color="#4a3f7a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="brass" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#7f8a99"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>

  <!-- Other display (external monitor) -->
  <rect x="14" y="14" width="532" height="312" rx="16" fill="url(#bezel)"/>
  <rect x="24" y="24" width="512" height="292" rx="9" fill="url(#wallOther)"/>
  <rect x="24" y="24" width="512" height="14" rx="0" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M250 326 L310 326 L322 356 L238 356 Z" fill="#2c2c2e"/>
  <rect x="210" y="354" width="140" height="8" rx="4" fill="#2c2c2e"/>

  <!-- MacOS Dock on it -->
  <rect x="88" y="256" width="384" height="48" rx="15" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55"/>
  <g>
    <circle cx="115" cy="278" r="14" fill="#2f8cff"/>
    <circle cx="151" cy="278" r="14" fill="#34c759"/>
    <circle cx="187" cy="278" r="14" fill="#ff9f0a"/>
    <circle cx="223" cy="278" r="14" fill="#ff375f"/>
    <circle cx="259" cy="278" r="14" fill="#bf5af2"/>
    <circle cx="295" cy="278" r="14" fill="#64d2ff"/>
    <circle cx="331" cy="278" r="14" fill="#ffd60a"/>
    <circle cx="367" cy="278" r="14" fill="#30d158"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="115" cy="298" r="2"/>
    <circle cx="151" cy="298" r="2"/>
    <circle cx="223" cy="298" r="2"/>
    <circle cx="295" cy="298" r="2"/>
    <circle cx="367" cy="298" r="2"/>
  </g>
  <line x1="398" y1="266" x2="398" y2="292" stroke="#ffffff" stroke-opacity="0.5"/>
  <!-- minimized window tile -->
  <rect x="410" y="266" width="24" height="18" rx="3" fill="#f2f2f7"/>
  <rect x="410" y="266" width="24" height="5" rx="2" fill="#d1d1d6"/>
  <!-- silver gear -->
  <rect x="440" y="264" width="26" height="26" rx="6" fill="#0b1d45" stroke="#98a2b0"/>
  <circle cx="453" cy="277" r="8" fill="none" stroke="url(#brass)" stroke-width="5" stroke-dasharray="3 2.2"/>
  <circle cx="453" cy="277" r="6" fill="url(#brass)"/>
  <circle cx="453" cy="277" r="2" fill="#0b1d45"/>

  <!-- Main display (MacBook) -->
  <rect x="606" y="64" width="332" height="222" rx="12" fill="url(#bezel)"/>
  <rect x="614" y="72" width="316" height="206" rx="6" fill="url(#wallMain)"/>
  <rect x="614" y="72" width="316" height="11" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M586 288 L958 288 L944 302 L600 302 Z" fill="#3a3a3c"/>
  <rect x="740" y="288" width="64" height="4" rx="2" fill="#1c1c1e"/>

  <!-- macOS Dock on it -->
  <rect x="690" y="240" width="164" height="30" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.5"/>
  <g>
    <circle cx="708" cy="255" r="9" fill="#2f8cff"/>
    <circle cx="732" cy="255" r="9" fill="#34c759"/>
    <circle cx="756" cy="255" r="9" fill="#ff9f0a"/>
    <circle cx="780" cy="255" r="9" fill="#ff375f"/>
    <circle cx="804" cy="255" r="9" fill="#bf5af2"/>
    <circle cx="828" cy="255" r="9" fill="#64d2ff"/>
  </g>

  <!-- Captions -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#8e8e93">
    <text x="280" y="392">Other display — <tspan font-weight="600" fill="#2f6fc0">MacOS Dock</tspan>, always there</text>
    <text x="772" y="392">Main display — the macOS Dock</text>
  </g>
</svg>
